    <script>
      (function() {
        try {
          var saved = localStorage.getItem('titian_theme');
          if (saved) {
            var theme = JSON.parse(saved);
            var root = document.documentElement;
            if (theme.primary) root.style.setProperty('--color-primary', theme.primary);
            if (theme.primaryDark) root.style.setProperty('--color-primary-dark', theme.primaryDark);
            if (theme.primaryLight) root.style.setProperty('--color-primary-light', theme.primaryLight);
            if (theme.primarySoft) root.style.setProperty('--color-primary-soft', theme.primarySoft);
            if (theme.accent) root.style.setProperty('--color-accent', theme.accent);
            if (theme.bg) root.style.setProperty('--color-bg', theme.bg);
            if (theme.surface) root.style.setProperty('--color-surface', theme.surface);
            if (theme.muted) root.style.setProperty('--color-muted', theme.muted);
            if (theme.border) root.style.setProperty('--color-border', theme.border);
            if (theme.text) root.style.setProperty('--color-text', theme.text);
            if (theme.textMuted) root.style.setProperty('--color-text-muted', theme.textMuted);
            if (theme.isDark) {
              root.classList.add('dark');
            } else {
              root.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased selection:bg-[var(--color-primary)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
